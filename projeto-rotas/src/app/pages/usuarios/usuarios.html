<section>
    <h2>Bem-vindo ao Sistema de Cadastro de Usuários</h2>
    <form #form="ngForm" (ngSubmit)="adicionarUsuario()">
        <label for="nome">Nome:</label>
        <input 
        type="text" 
        id="nome"
        name="nome"
        [(ngModel)]="nome" required>

        <label for="email">Email:</label>
        <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        required>

        <button type="submit">Cadastrar</button>
    </form>
    <hr>

    <h2>Lista de Usuários</h2>
    <ul>
        @for (usuario of usuarios; track $index) {
            <li>{{ usuario.nome }} - {{ usuario.email }}</li>
        }
    </ul>
</section>
